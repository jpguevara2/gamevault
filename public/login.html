<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameVault — Acceso</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Share+Tech+Mono&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0f;
      color: #e0e0f0;
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-title {
      font-family: 'Orbitron', monospace;
      font-size: 26px;
      font-weight: 700;
      color: #00e5ff;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .logo-sub {
      font-size: 11px;
      color: #6b6b8a;
      letter-spacing: 3px;
      margin-top: 4px;
    }
    .card {
      background: #111118;
      border: 1px solid #2a2a3e;
      border-radius: 12px;
      padding: 2rem;
    }
    .tabs {
      display: flex;
      gap: 4px;
      background: #0d0d18;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 1.5rem;
    }
    .tab {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: none;
      border-radius: 6px;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1px;
      color: #8888bb;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.15s;
    }
    .tab.active { background: #7c4dff; color: #fff; }
    .panel { display: none; }
    .panel.active { display: block; }
    .form-group { margin-bottom: 1rem; }
    .form-label {
      display: block;
      font-size: 10px;
      letter-spacing: 2px;
      color: #6b6b8a;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      background: #16161f;
      border: 1px solid #2a2a3e;
      border-radius: 6px;
      padding: 10px 12px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      color: #e0e0f0;
      transition: border-color 0.2s;
    }
    .form-input:focus { outline: none; border-color: #7c4dff; }
    .form-input::placeholder { color: #444460; }
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }
    .btn-primary { background: #7c4dff; color: #fff; }
    .btn-primary:hover { background: #6a3de8; }
    .btn-google {
      background: #fff;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 1rem;
      border: 1px solid #ddd;
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      letter-spacing: 0;
      text-transform: none;
    }
    .btn-google:hover { background: #f5f5f5; }
    .btn-google img { width: 20px; height: 20px; }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 1.25rem 0;
      color: #444460;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2a2a3e;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 1rem;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .msg.show { display: flex; }
    .msg-error   { background: rgba(255,61,107,0.12); border: 1px solid rgba(255,61,107,0.3); color: #ff3d6b; }
    .msg-success { background: rgba(0,230,118,0.12);  border: 1px solid rgba(0,230,118,0.3);  color: #00e676; }
    #google-disabled { font-size: 11px; color: #6b6b8a; text-align: center; margin-top: 0.75rem; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-title"><i class="ti ti-device-gamepad-2"></i> GameVault</div>
      <div class="logo-sub">Gestor de Colección</div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" data-tab="login">Iniciar sesión</button>
        <button class="tab" data-tab="register">Registrarse</button>
      </div>

      <!-- LOGIN -->
      <div class="panel active" id="panel-login">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" id="login-email" type="email" placeholder="tu@email.com" />
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input class="form-input" id="login-password" type="password" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary" id="btn-login"><i class="ti ti-login"></i> Entrar</button>
        <div class="msg msg-error" id="login-error"></div>

        <div class="divider">o</div>
        <button class="btn btn-google" id="btn-google-login">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
          Continuar con Google
        </button>
        <p id="google-disabled">Google OAuth no configurado. Agrega GOOGLE_CLIENT_ID en .env</p>
      </div>

      <!-- REGISTRO -->
      <div class="panel" id="panel-register">
        <div class="form-group">
          <label class="form-label">Nombre</label>
          <input class="form-input" id="reg-nombre" placeholder="Tu nombre" />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" id="reg-email" type="email" placeholder="tu@email.com" />
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña (mín. 6 caracteres)</label>
          <input class="form-input" id="reg-password" type="password" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary" id="btn-register"><i class="ti ti-user-plus"></i> Crear cuenta</button>
        <div class="msg msg-error"   id="reg-error"></div>
        <div class="msg msg-success" id="reg-success"></div>

        <div class="divider">o</div>
        <button class="btn btn-google" id="btn-google-reg">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
          Registrarse con Google
        </button>
      </div>
    </div>
  </div>

<script>
  // Si ya está logueado, redirigir
  fetch('/auth/me').then(r => r.json()).then(data => {
    if (data.user) window.location.href = '/';
  });

  // Mostrar/ocultar botones de Google según configuración
  fetch('/auth/google-available').then(r => r.json()).then(data => {
    const btns = document.querySelectorAll('.btn-google');
    const note = document.getElementById('google-disabled');
    if (!data.available) {
      btns.forEach(b => b.style.display = 'none');
      const dividers = document.querySelectorAll('.divider');
      dividers.forEach(d => d.style.display = 'none');
      note.style.display = 'block';
    }
  }).catch(() => {});

  // Tabs
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  function showErr(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 4000);
  }

  // Login
  async function doLogin() {
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) return showErr('login-error', 'Completa todos los campos.');
    try {
      const res  = await fetch('/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, password}) });
      const data = await res.json();
      if (!res.ok) return showErr('login-error', data.error || 'Error al iniciar sesión');
      window.location.href = '/';
    } catch(e) { showErr('login-error', 'Error de conexión'); }
  }
  document.getElementById('btn-login').addEventListener('click', doLogin);
  document.getElementById('login-password').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

  // Registro
  document.getElementById('btn-register').addEventListener('click', async () => {
    const nombre   = document.getElementById('reg-nombre').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    if (!nombre || !email || !password) return showErr('reg-error', 'Completa todos los campos.');
    try {
      const res  = await fetch('/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({nombre, email, password}) });
      const data = await res.json();
      if (!res.ok) return showErr('reg-error', data.error || 'Error al registrarse');
      window.location.href = '/';
    } catch(e) { showErr('reg-error', 'Error de conexión'); }
  });

  // Google
  document.getElementById('btn-google-login').addEventListener('click', () => window.location.href = '/auth/google');
  document.getElementById('btn-google-reg').addEventListener('click',   () => window.location.href = '/auth/google');

  // Params de error
  const params = new URLSearchParams(window.location.search);
  if (params.get('error') === 'google')    showErr('login-error', 'Error al iniciar sesión con Google.');
  if (params.get('error') === 'no_google') showErr('login-error', 'Google OAuth no está configurado. Usa usuario y contraseña.');
  if (params.get('error') === 'session')    showErr('login-error', 'Tu sesión expiró o fue cerrada desde otro dispositivo. Inicia sesión nuevamente.');
</script>
</body>
</html>
